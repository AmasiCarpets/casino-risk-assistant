<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Limbo Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Limbo Demo</h1>
        <p>نسخة تجريبية برصيد افتراضي فقط</p>
      </div>
      <div class="balance-box">
        <span>الرصيد</span>
        <strong><span id="balance">1000.00</span> نقطة</strong>
      </div>
    </header>

    <section class="game-card">
      <div class="result-area">
        <div id="result" class="result">1.00×</div>
        <div id="status" class="status">حدد المبلغ والهدف ثم اضغط BET</div>
        <div class="fair-row">
          <span>Hash الجولة:</span>
          <code id="roundHash">—</code>
        </div>
      </div>

      <div class="controls">
        <label>
          مبلغ الرهان الافتراضي
          <div class="input-wrap">
            <input id="betAmount" type="number" min="0.01" step="0.01" value="10" />
            <button id="halfBtn" type="button">½</button>
            <button id="doubleBtn" type="button">2×</button>
          </div>
        </label>

        <label>
          المضاعف المستهدف
          <div class="input-wrap">
            <input id="target" type="number" min="1.01" max="1000000" step="0.01" value="2.00" />
          </div>
        </label>

        <div class="stats">
          <div>
            <span>فرصة الفوز التقريبية</span>
            <strong id="chance">49.50%</strong>
          </div>
          <div>
            <span>الربح عند الفوز</span>
            <strong id="profit">10.00</strong>
          </div>
        </div>

        <button id="betBtn" class="bet-btn" type="button">BET</button>

        <div class="quick-targets">
          <button data-target="1.50">1.50×</button>
          <button data-target="2">2.00×</button>
          <button data-target="5">5.00×</button>
          <button data-target="10">10.00×</button>
          <button data-target="100">100×</button>
        </div>
      </div>
    </section>

    <section class="history-card">
      <div class="history-head">
        <h2>آخر الجولات</h2>
        <button id="resetBtn" type="button">إعادة الرصيد</button>
      </div>
      <div id="history" class="history"></div>
    </section>

    <p class="notice">
      هذه لعبة محاكاة تعليمية بنقاط افتراضية، ولا تدعم الإيداع أو السحب أو المقامرة بأموال حقيقية.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
