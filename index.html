<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limbo Multi 10</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#07141c;--panel:#102733;--panel2:#173746;--panel3:#0b1e28;
--border:#2b5365;--text:#f5fbff;--muted:#9eb6c2;
--green:#00e701;--red:#ff4d63;--blue:#2f82e6
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{width:min(1180px,calc(100% - 14px));margin:10px auto 40px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:var(--green);color:#073507;font-weight:900;font-size:21px}
.brand h1{margin:0;font-size:27px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.balance{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 15px;display:grid;gap:5px;min-width:245px}
.balance span{color:var(--muted);font-size:12px}
.balance strong{direction:ltr;text-align:right;font-size:21px}
.controls{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:7px;color:#d0dde4;font-size:14px}
input{width:100%;background:var(--panel3);color:white;border:1px solid var(--border);border-radius:10px;padding:13px;outline:none;direction:ltr;text-align:right}
.row{display:flex;background:var(--panel3);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.row input{border:0;border-radius:0}
.row button{min-width:52px;border:0;border-right:1px solid var(--border);background:var(--panel2);color:white}
.summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div,.stats div{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:11px;display:grid;gap:5px}
.summary span,.stats span{font-size:11px;color:var(--muted)}
.summary strong,.stats strong{direction:ltr;font-size:17px}
.bet{grid-column:1/-1;border:0;border-radius:12px;background:var(--green);color:#073207;font-size:20px;font-weight:900;padding:16px;box-shadow:0 10px 28px rgba(0,231,1,.16)}
.bet:disabled{opacity:.55}
.secondary{grid-column:1/-1;display:flex;justify-content:center;gap:8px}
.secondary button{border:1px solid var(--border);background:var(--panel2);color:white;border-radius:9px;padding:9px 14px}
.boards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
.board{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:224px;display:grid;align-content:space-between;gap:9px;transition:.2s}
.board.running{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.25)}
.board.win{border-color:var(--green);box-shadow:0 0 20px rgba(0,231,1,.10)}
.board.lose{border-color:var(--red)}
.head{display:flex;justify-content:space-between;gap:5px}
.head b{font-size:14px}
.head span{font-size:11px;color:var(--muted)}
.result{text-align:center;font-size:36px;font-weight:900;direction:ltr}
.board.win .result{color:var(--green)}
.board.lose .result{color:var(--red)}
.meta{display:grid;gap:5px;font-size:10px}
.meta div{display:flex;justify-content:space-between;gap:5px;color:var(--muted)}
.meta code{direction:ltr;color:#d6e1e7;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin-top:14px}
@media(max-width:900px){.boards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){
.app{width:min(100% - 8px,1180px);margin-top:5px}
.header{flex-direction:column;align-items:stretch}
.balance{min-width:0}
.controls{grid-template-columns:1fr;padding:11px}
.summary{grid-template-columns:1fr}
.boards{grid-template-columns:repeat(2,1fr);gap:6px}
.board{min-height:210px;padding:9px}
.result{font-size:31px}
.stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main class="app">
<header class="header">
  <div class="brand">
    <div class="logo">10X</div>
    <div><h1>Limbo Multi</h1><p>عشر لوحات مستقلة</p></div>
  </div>
  <div class="balance"><span>الرصيد الافتراضي</span><strong><span id="balance">1,000,000.00</span> نقطة</strong></div>
</header>

<section class="controls">
  <label>مبلغ الرهان لكل لوحة
    <div class="row">
      <input id="betAmount" type="number" min="0.01" step="0.01" value="100">
      <button id="half">½</button><button id="double">2×</button>
    </div>
  </label>

  <label>المضاعف المستهدف
    <input id="target" type="number" min="1.01" max="1000000" step="0.01" value="2.00">
  </label>

  <div class="summary">
    <div><span>تكلفة تشغيل العشر</span><strong id="cost">1,000.00</strong></div>
    <div><span>فرصة الفوز لكل لوحة</span><strong id="chance">49.5000%</strong></div>
    <div><span>صافي ربح اللوحة الفائزة</span><strong id="profit">100.00</strong></div>
  </div>

  <button id="betBtn" class="bet">BET × 10</button>

  <div class="secondary">
    <button id="resetBalance">إعادة الرصيد</button>
    <button id="resetAll">تصفير الكل</button>
  </div>
</section>

<section id="boards" class="boards"></section>

<section class="stats">
  <div><span>اللوحات المشغلة</span><strong id="rounds">0</strong></div>
  <div><span>الفوز</span><strong id="wins">0</strong></div>
  <div><span>الخسارة</span><strong id="losses">0</strong></div>
  <div><span>صافي الربح</span><strong id="net">0.00</strong></div>
</section>

<p class="note">نسخة محاكاة بنقاط افتراضية فقط، ولا تحتوي على إيداع أو سحب.</p>
</main>

<script>
const COUNT=10, EDGE=.01, START=1000000;
const $=id=>document.getElementById(id);
let balance=START, busy=false, stats={rounds:0,wins:0,losses:0,net:0};

const boards=Array.from({length:COUNT},(_,i)=>({
  id:i+1,
  clientSeed:crypto.randomUUID(),
  serverSeed:crypto.randomUUID(),
  nonce:0
}));

function money(n){
  return Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function short(s){return s.slice(0,6)+"…"+s.slice(-4)}
function random01(){
  const a=new Uint32Array(2);crypto.getRandomValues(a);
  return (a[0]*2**21+(a[1]>>>11))/2**53;
}
function mult(r){
  return Math.max(1,Math.floor(((1-EDGE)/Math.max(1-r,Number.EPSILON))*100)/100);
}
async function hash(text){
  const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function renderBoards(){
  $("boards").innerHTML="";
  boards.forEach(b=>{
    const el=document.createElement("article");
    el.className="board";el.id="board-"+b.id;
    el.innerHTML=`
      <div class="head"><b>لوحة ${b.id}</b><span id="s-${b.id}">جاهزة</span></div>
      <div class="result" id="r-${b.id}">1.00×</div>
      <div class="meta">
        <div><span>Client</span><code id="c-${b.id}">${short(b.clientSeed)}</code></div>
        <div><span>Server</span><code id="v-${b.id}">${short(b.serverSeed)}</code></div>
        <div><span>Nonce</span><code id="n-${b.id}">0</code></div>
        <div><span>Hash</span><code id="h-${b.id}">—</code></div>
      </div>`;
    $("boards").appendChild(el);
  });
}
function update(){
  const bet=Math.max(Number($("betAmount").value)||0,0);
  const target=Math.max(Number($("target").value)||1.01,1.01);
  $("balance").textContent=money(balance);
  $("cost").textContent=money(bet*COUNT);
  $("chance").textContent=(((1-EDGE)/target)*100).toFixed(4)+"%";
  $("profit").textContent=money(bet*target-bet);
  $("rounds").textContent=stats.rounds;
  $("wins").textContent=stats.wins;
  $("losses").textContent=stats.losses;
  $("net").textContent=money(stats.net);
}
async function one(board,target){
  board.nonce++;
  board.serverSeed=crypto.randomUUID();
  const r=random01();
  const result=mult(r);
  const proof=await hash(`${board.serverSeed}:${board.clientSeed}:${board.nonce}:${r}`);
  return {result,won:result>=target,proof};
}
async function play(){
  if(busy)return;
  const bet=Number($("betAmount").value);
  const target=Number($("target").value);
  const cost=bet*COUNT;

  if(!Number.isFinite(bet)||bet<=0){alert("اكتب مبلغاً صحيحاً أكبر من صفر");return}
  if(!Number.isFinite(target)||target<1.01){alert("المضاعف يجب أن يكون 1.01 أو أكثر");return}
  if(cost>balance){alert("الرصيد غير كافٍ لتشغيل العشر لوحات");return}

  busy=true;$("betBtn").disabled=true;
  balance-=cost;stats.net-=cost;update();

  boards.forEach(b=>{
    $("board-"+b.id).className="board running";
    $("s-"+b.id).textContent="تلعب…";
    $("r-"+b.id).textContent="—";
  });

  const outcomes=await Promise.all(boards.map(b=>one(b,target)));
  await new Promise(r=>setTimeout(r,450));

  outcomes.forEach((o,i)=>{
    const b=boards[i];
    $("board-"+b.id).className="board "+(o.won?"win":"lose");
    $("s-"+b.id).textContent=o.won?"فوز":"خسارة";
    $("r-"+b.id).textContent=o.result.toFixed(2)+"×";
    $("v-"+b.id).textContent=short(b.serverSeed);
    $("n-"+b.id).textContent=b.nonce;
    $("h-"+b.id).textContent=o.proof.slice(0,8)+"…";
    stats.rounds++;
    if(o.won){
      const payout=bet*target;
      balance+=payout;stats.net+=payout;stats.wins++;
    }else stats.losses++;
  });

  update();busy=false;$("betBtn").disabled=false;
}

$("betBtn").onclick=play;
$("betAmount").oninput=update;
$("target").oninput=update;
$("half").onclick=()=>{$("betAmount").value=Math.max((Number($("betAmount").value)||0)/2,.01).toFixed(2);update()};
$("double").onclick=()=>{$("betAmount").value=Math.min((Number($("betAmount").value)||0)*2,balance/COUNT).toFixed(2);update()};
$("resetBalance").onclick=()=>{balance=START;update()};
$("resetAll").onclick=()=>{
  balance=START;stats={rounds:0,wins:0,losses:0,net:0};
  boards.forEach(b=>{b.clientSeed=crypto.randomUUID();b.serverSeed=crypto.randomUUID();b.nonce=0});
  renderBoards();update();
};

renderBoards();update();
</script>
</body>
</html>
